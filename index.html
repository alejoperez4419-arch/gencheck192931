<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin 2026 Efootball</title>
    <link rel="stylesheet" href="style.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020b08">
    <link rel="apple-touch-icon" href="admin.png">

    <!-- STYLES -->
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
</head>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker registrado'))
                .catch(err => console.log('SW error', err));
        });
    }
</script>

<body>

    <div class="app">

        <!-- SECTION 1 -->
        <section class="section active" id="section1">
            <img id="logo" src="logo white2.png" alt="">

            <input type="text" id="userId" placeholder="Enter your ID">

            <label class="check">
                <div class="check-left">
                    <img src="coin.png" alt="Coins">
                    <span>999,999,999</span>
                </div>
                <input type="checkbox" id="coins">
            </label>

            <label class="check">
                <div class="check-left">
                    <img src="gp.png" alt="GP">
                    <span>999,999,999</span>
                </div>
                <input type="checkbox" id="gp">
            </label>

            <label class="check">
                <div class="check-left">
                    <img src="admin.png" alt="Admin">
                    <span>Admin 2026</span>
                </div>
                <input type="checkbox" id="admin">
            </label>

            <button onclick="goToSection2()">Next</button>
        </section>

        <!-- SECTION 2 -->
        <section class="section" id="section2">
            <h2>⏳ Processing...</h2>

            <div class="counter-box">
                <p>Coins</p>
                <span id="coinsCounter">0</span>
            </div>

            <div class="counter-box">
                <p>GP</p>
                <span id="gpCounter">0</span>
            </div>
        </section>

        <!-- SECTION 3 -->
        <section class="section" id="section3">
            <h1>🎉 Congratulation</h1>
            <p id="resultText"></p>
            <button onclick="location.reload()">Generate Again</button>
        </section>

    </div>

    <script src="main.js"></script>
</body>

</html>
